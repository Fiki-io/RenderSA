name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Prebuilt Android SDK, NDK & CMake
        run: |
          echo "=== Android Environment Diagnostics ==="
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV

          # Use prebuilt NDK 27.3.13750724
          TARGET_NDK="$ANDROID_ROOT/ndk/27.3.13750724"
          if [ -d "$TARGET_NDK" ]; then
            echo "Preinstalled NDK 27.3.13750724 found at: $TARGET_NDK"
            echo "ANDROID_NDK_HOME=$TARGET_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$TARGET_NDK" >> $GITHUB_ENV
          elif [ -d "$ANDROID_ROOT/ndk" ]; then
            FALLBACK_NDK=$(ls -d $ANDROID_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
            echo "Fallback NDK found at: $FALLBACK_NDK"
            echo "ANDROID_NDK_HOME=$FALLBACK_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$FALLBACK_NDK" >> $GITHUB_ENV
          fi

          # Use prebuilt CMake 3.22.1
          if [ -d "$ANDROID_ROOT/cmake/3.22.1/bin" ]; then
            echo "Preinstalled CMake 3.22.1 added to PATH"
            echo "$ANDROID_ROOT/cmake/3.22.1/bin" >> $GITHUB_PATH
          fi

          # Accept SDK licenses
          yes | $ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install & Configure ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache jq curl
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache -M 2G
          ccache -s

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Verify Debug Keystore
        run: |
          if [ -f "debug.keystore" ]; then
            echo "Persistent debug.keystore is present."
          else
            echo "ERROR: debug.keystore is missing!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload APK to GoFile
        id: upload_gofile
        env:
          APK_FILE: ${{ steps.locate_apk.outputs.apk_path }}
        run: |
          echo "=== Mengunggah APK ke GoFile ==="
          echo "Target berkas: $APK_FILE"

          python3 - << 'PYEOF'
          import os, sys, json, subprocess

          apk_path = os.environ.get("APK_FILE", "")
          if not apk_path or not os.path.exists(apk_path):
              print("ERROR: APK file tidak ditemukan:", apk_path)
              sys.exit(1)

          download_url = ""
          try:
              # Dapatkan daftar server aktif
              servers_cmd = ["curl", "-s", "--max-time", "15", "https://api.gofile.io/servers"]
              res = subprocess.run(servers_cmd, capture_output=True, text=True)
              server_data = json.loads(res.stdout)
              servers = [s.get("name") for s in server_data.get("data", {}).get("servers", []) if s.get("name")]
          except Exception as e:
              print("Peringatan saat mengambil daftar server:", e)
              servers = ["store-eu-par-12", "store-eu-par-6", "store1"]

          if not servers:
              servers = ["store-eu-par-12", "store1"]

          for server in servers[:3]:
              try:
                  print(f"Mencoba unggah ke server: {server}...")
                  upload_url = f"https://{server}.gofile.io/contents/uploadfile"
                  upload_cmd = ["curl", "-s", "--max-time", "300", "-F", f"file=@{apk_path}", upload_url]
                  upload_res = subprocess.run(upload_cmd, capture_output=True, text=True)
                  data = json.loads(upload_res.stdout)
                  if data.get("status") == "ok":
                      download_url = data.get("data", {}).get("downloadPage", "")
                      if download_url:
                          print("Unggah berhasil:", download_url)
                          break
              except Exception as e:
                  print(f"Gagal unggah ke {server}:", e)

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"gofile_url={download_url}\n")

          print("==========================================================")
          if download_url:
              print(f"SUKSES: Tautan Unduh GoFile: {download_url}")
          else:
              print("PERINGATAN: Unggah GoFile tidak mengembalikan URL.")
          print("==========================================================")
          PYEOF

      - name: Publish Build Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🎮 Hasil Build Debug APK RenderSA

          | Informasi | Nilai |
          |---|---|
          | **Nama Berkas** | `${{ steps.locate_apk.outputs.apk_name }}` |
          | **Ukuran Berkas** | `${{ steps.locate_apk.outputs.apk_size }}` |
          | **Tipe Build** | `assembleDebug` (Ditandatangani dengan persistent `debug.keystore`) |
          | **Tautan GoFile** | ${{ steps.upload_gofile.outputs.gofile_url && format('[Unduh dari GoFile]({0})', steps.upload_gofile.outputs.gofile_url) || 'Gagal / Tidak Tersedia' }} |
          EOF

      - name: Upload APK Artifact to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_apk.outputs.apk_name }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14

